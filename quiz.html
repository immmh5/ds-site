<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاختبار الشامل · Data Science Study Hub</title>
<meta name="description" content="اختبار شامل من كل الدروس الستة: تدريب بفيديك فوري أو امتحان بنتيجة بالنهاية، مع شرح كل إجابة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="nav"></div>

<div class="wrap hero">
  <span class="badge">الاختبار الشامل · كل الدروس</span>
  <h1>اختبر نفسك في كل شيء <span class="small muted" style="font-family:var(--font-en)">The Big Test</span></h1>
  <p class="sub" id="qcount"></p>
</div>

<div class="wrap">
  <div class="mode-tabs" data-tabs>
    <button class="btn sm on" data-m="practice">تدريب (فيديك فوري)</button>
    <button class="btn sm ghost" data-m="exam">امتحان (نتيجة بالنهاية)</button>
  </div>
  <div id="qz" class="q-zone"></div>
</div>

<footer><div class="wrap center">Data Science Study Hub · الاختبار الشامل</div></footer>

<script src="assets/core.js"></script>
<script src="lessons/data-c1.js"></script>
<script src="lessons/data-c2.js"></script>
<script src="lessons/data-c3.js"></script>
<script src="lessons/data-c4.js"></script>
<script src="lessons/data-c5.js"></script>
<script src="lessons/data-c6.js"></script>
<script>
  DS.nav('quiz');
  const ALL = ['c1','c2','c3','c4','c5','c6']
    .map(id => window['LESSON_' + id.toUpperCase()].quiz.map(q => Object.assign({}, q, { tag: id.toUpperCase() })))
    .reduce((a, b) => a.concat(b), []);
  document.getElementById('qcount').textContent = ALL.length + ' سؤال من كل الدروس الستة — مختلطة بالترتيب. في التدريب يعطيك شرح فوري لكل إجابة.';
  const tabs = document.querySelector('[data-tabs]');
  let mode = 'practice';
  function start() { DS.quiz(document.getElementById('qz'), ALL, { mode, id: 'final', title: 'الاختبار الشامل' }); }
  tabs.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    Array.from(tabs.querySelectorAll('button')).forEach(x => x.classList.toggle('on', x === b));
    Array.from(tabs.querySelectorAll('button')).forEach(x => x.classList.toggle('ghost', x !== b));
    start();
  });
  start();
</script>
</body>
</html>
